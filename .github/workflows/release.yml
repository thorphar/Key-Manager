name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Windows version $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write version metadata
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows icon
        run: python scripts/build_icons.py

      - name: Build executable
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller packaging/KeyManager.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer/KeyManager.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/KeyManager-${{ steps.version.outputs.version }}.exe
            dist/KeyManager-${{ steps.version.outputs.version }}-setup.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Linux version $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libgssapi-krb5-2 \
            libkrb5-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libxkbcommon0

      - name: Write version metadata
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller packaging/KeyManager-linux.spec --noconfirm --clean

      - name: Package tarball
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/package_linux.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/KeyManager-${{ steps.version.outputs.version }}
            dist/KeyManager-${{ steps.version.outputs.version }}-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeyManager-${{ steps.version.outputs.version }}.exe
            dist/KeyManager-${{ steps.version.outputs.version }}-setup.exe
            dist/KeyManager-${{ steps.version.outputs.version }}
            dist/KeyManager-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          generate_release_notes: true
