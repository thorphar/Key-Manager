name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write version metadata
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller packaging/KeyManager.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          iscc installer/KeyManager.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyManager-${{ steps.version.outputs.version }}-windows
          path: |
            dist/KeyManager-${{ steps.version.outputs.version }}.exe
            dist/KeyManager-${{ steps.version.outputs.version }}-setup.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeyManager-${{ steps.version.outputs.version }}.exe
            dist/KeyManager-${{ steps.version.outputs.version }}-setup.exe
          generate_release_notes: true
